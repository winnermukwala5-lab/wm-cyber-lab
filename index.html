<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WM CYBER LAB</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:380px;padding:25px;border:1px solid #777;border-radius:18px;background:linear-gradient(145deg,#242424,#080808);box-shadow:0 0 25px #000}
h2{text-align:center;color:#d4b36a;font-size:22px}
input,button{width:100%;padding:14px;margin-top:12px;border-radius:9px;font-size:16px}
input{background:#191919;border:1px solid #555;color:white}
button{background:#b99b5b;color:#111;border:0;font-weight:bold}
.result{margin-top:25px;padding:18px;border:1px solid #555;border-radius:12px;text-align:center}
.status{color:#e6b95c;font-weight:bold;font-size:20px}
small{color:#aaa}

.logo {
    display: block;
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 50%;
    margin: 0 auto 18px;
    border: 2px solid #d4b36a;
    box-shadow: 0 0 18px #d4b36a55;
}
</style>
</head>
<body>
<div class="card">
<img src="images/logo.jpeg" alt="Logo WM CYBER LAB" class="logo">
<h2>⚖️ WM CYBER LAB</h2>
<p style="text-align:center">SIMULATEUR DE STATUT</p>
<input id="numero" type="tel" placeholder="Ex. +509 32 39 2290">
<button onclick="verifier()">VÉRIFIER LA SIMULATION</button>
<div class="result">
<p>📱 STATUT DU NUMÉRO</p>
<div id="statut" class="status">EN ATTENTE</div>
<p id="message">Entre un numéro pour commencer.</p>
</div>
<p style="text-align:center"><small>Démo éducative — aucun bannissement réel.</small></p>
</div>
<script>
function verifier(){
const numero=document.getElementById('numero').value.trim();
if(!numero){alert('Entre un numéro.');return;}
document.getElementById('statut').textContent='SIMULATION';
document.getElementById('message').textContent=
'Numéro saisi : '+numero+'. Statut réel non vérifié.';
}
</script>
</body>
</html>
