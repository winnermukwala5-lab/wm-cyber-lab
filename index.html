<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WM CYBER LAB</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 24px;
}
.card {
  width: 100%;
  max-width: 430px;
  padding: 26px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(145deg, var(--surface), var(--bg));
  box-shadow: 0 0 35px rgba(0, 255, 157, 0.08);
}
.card h2 {
  text-align: center;
  color: var(--accent);
  font-size: 22px;
  margin-bottom: 12px;
}
.card input,
.card button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 9px;
  font-size: 16px;
}
.card input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
}
.card input:focus {
  outline: 1px solid var(--accent);
  border-color: var(--accent);
}
.card button {
  background: var(--accent);
  color: #04120a;
  border: 0;
  font-weight: 800;
  cursor: pointer;
}
.card button:hover {
  box-shadow: 0 0 22px rgba(0, 255, 157, 0.2);
}
.card .result {
  margin-top: 25px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  text-align: center;
  background: var(--bg-alt);
}
.card .status {
  color: var(--accent);
  font-weight: 800;
  font-size: 20px;
}
.card small {
  color: var(--text-muted);
}
.card .logo {
  margin: 0 auto 18px;
}
@media (max-width: 480px) {
  body {
    padding: 14px;
  }
  .card {
    padding: 20px;
  }
}
</style>
</head>
<body>
<div class="card">
<img src="images/logo.jpeg" alt="Logo WM CYBER LAB" class="logo">
<h2>⚖️ WM CYBER LAB</h2>
<p style="text-align:center">SIMULATEUR DE STATUT</p>
<input id="numero" type="tel" placeholder="Ex. +509 32 39 2290">
<button onclick="verifier()">VÉRIFIER LA SIMULATION</button>
<div class="result">
<p>📱 STATUT DU NUMÉRO</p>
<div id="statut" class="status">EN ATTENTE</div>
<p id="message">Entre un numéro pour commencer.</p>
</div>
<p style="text-align:center"><small>Démo éducative — aucun bannissement réel.</small></p>
</div>
<script>
function verifier(){
const numero=document.getElementById('numero').value.trim();
if(!numero){alert('Entre un numéro.');return;}
document.getElementById('statut').textContent='SIMULATION';
document.getElementById('message').textContent=
'Numéro saisi : '+numero+'. Statut réel non vérifié.';
}
</script>
</body>
</html>
